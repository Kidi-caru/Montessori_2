<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Producto - Montessori 3D</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="sidebar">
        <h2>Montessori 3D</h2>
        <a href="/dashboard"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="/inventario" class="activo"><i class="bi bi-box-seam"></i> Inventario</a>
        <a href="/muebles"><i class="bi bi-house-door"></i> Muebles</a>
        <a href="/comedores"><i class="bi bi-grid-3x3-gap"></i> Comedores</a>
        <a href="/basecamas"><i class="bi bi-intersect"></i> Base Camas</a>
        <a href="/colchones"><i class="bi bi-square"></i> Colchones</a>
        <a href="/spaceview"><i class="bi bi-box"></i> Simulador 3D</a>
        <a href="/clientes"><i class="bi bi-people"></i> Clientes</a>
        <a href="/proveedores"><i class="bi bi-truck"></i> Proveedores</a>
        <a href="/ventas"><i class="bi bi-cart"></i> Ventas</a>
        <a href="/reportes"><i class="bi bi-file-earmark-bar-graph"></i> Reportes</a>
        <a href="/logout" class="text-danger"><i class="bi bi-box-arrow-right"></i> Cerrar sesión</a>
    </div>

    <div class="contenido">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Editar Producto</h1>
            <a href="/inventario" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Volver al Inventario</a>
        </div>

        <div class="card p-4 shadow-sm" style="background: white; border-radius: 15px;">
            <form action="/editar_producto/{{ producto.id }}" method="POST" enctype="multipart/form-data">
                <div class="row g-3">
                    
                    <div class="col-md-6">
                        <label for="codigo" class="form-label fw-bold">Código del Producto:</label>
                        <input type="text" class="form-control" id="codigo" name="codigo" value="{{ producto.codigo }}" required>
                    </div>

                    <div class="col-md-6">
                        <label for="nombre" class="form-label fw-bold">Nombre del Producto:</label>
                        <input type="text" class="form-control" id="nombre" name="nombre" value="{{ producto.nombre }}" required>
                    </div>

                    <div class="col-md-6">
                        <label for="categoria" class="form-label fw-bold">Categoría:</label>
                        <select class="form-select form-control" id="categoria" name="categoria" required>
                            {% for cat in categorias %}
                                <option value="{{ cat.id }}" {% if cat.id == producto.categoria_id %}selected{% endif %}>
                                    {{ cat.nombre }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label for="material" class="form-label fw-bold">Material:</label>
                        <input type="text" class="form-control" id="material" name="material" value="{{ producto.material }}">
                    </div>

                    <div class="col-md-3">
                        <label for="color" class="form-label fw-bold">Color:</label>
                        <input type="text" class="form-control" id="color" name="color" value="{{ producto.color }}">
                    </div>

                    <div class="col-md-4">
                        <label for="largo" class="form-label fw-bold">Largo (cm):</label>
                        <input type="number" step="0.01" class="form-control" id="largo" name="largo" value="{{ producto.largo }}">
                    </div>

                    <div class="col-md-4">
                        <label for="ancho" class="form-label fw-bold">Ancho (cm):</label>
                        <input type="number" step="0.01" class="form-control" id="ancho" name="ancho" value="{{ producto.ancho }}">
                    </div>

                    <div class="col-md-4">
                        <label for="alto" class="form-label fw-bold">Alto (cm):</label>
                        <input type="number" step="0.01" class="form-control" id="alto" name="alto" value="{{ producto.alto }}">
                    </div>

                    <div class="col-md-6">
                        <label for="precio" class="form-label fw-bold">Precio ($ COP):</label>
                        <input type="number" class="form-control" id="precio" name="precio" value="{{ producto.precio | int }}" required>
                    </div>

                    <div class="col-md-6">
                        <label for="stock" class="form-label fw-bold">Stock disponible:</label>
                        <input type="number" class="form-control" id="stock" name="stock" value="{{ producto.stock }}" required>
                    </div>

                    <div class="col-12">
                        <label for="descripcion" class="form-label fw-bold">Descripción:</label>
                        <textarea class="form-control" id="descripcion" name="descripcion" rows="3">{{ producto.descripcion }}</textarea>
                    </div>

                    <div class="col-12 mt-3">
                        <label class="form-label fw-bold">Imagen Actual:</label><br>
                        {% if producto.imagen %}
                            <img src="{{ url_for('static', filename='uploads/' + producto.imagen) }}" width="120" class="img-thumbnail mb-2" alt="Imagen producto"><br>
                        {% else %}
                            <p class="text-muted">Sin imagen asignada.</p>
                        {% endif %}
                        <label for="imagen" class="form-label fw-bold">Cambiar Imagen (Opcional):</label>
                        <input type="file" class="form-control" id="imagen" name="imagen">
                    </div>

                    <div class="col-12 mt-4">
                        <button type="submit" class="btn btn-success px-4"><i class="bi bi-check-lg"></i> Guardar Cambios</button>
                        <a href="/inventario" class="btn btn-danger px-4 ms-2"><i class="bi bi-x-lg"></i> Cancelar</a>
                    </div>

                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
