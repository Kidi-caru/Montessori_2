<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Montessori 3D</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
   
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>

<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 p-3">

<div class="contenedor-login w-100" style="max-width: 420px;">
    <div class="card shadow-lg border-0 rounded-4 p-4 p-sm-5 bg-white">
        
        <div class="text-center mb-4">
            <div class="mb-3 text-primary">
                <i class="bi bi-box-seam fs-1 d-inline-block p-3 rounded-circle bg-primary-subtle"></i>
            </div>
            <h1 class="fw-bold text-dark fs-3 mb-1">Montessori 3D</h1>
            <p class="text-muted small">Sistema Inteligente de Inventario y Control</p>
        </div>

        {% with mensajes = get_flashed_messages() %}
            {% if mensajes %}
            <div class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ mensajes[0] }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endif %}
        {% endwith %}

        <form action="/validar" method="POST">
            <div class="mb-3">
                <label class="form-label fw-semibold text-dark">Usuario</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-person"></i></span>
                    <input type="text" name="usuario" class="form-control border-start-0 bg-light" placeholder="Nombre de usuario" autocomplete="username" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold text-dark">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" class="form-control border-start-0 bg-light" placeholder="••••••••" autocomplete="current-password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary fw-bold w-100 py-2 rounded-3 shadow-sm mb-3">
                <i class="bi bi-box-arrow-in-right me-1"></i> Ingresar
            </button>
        </form>

        <div class="text-center pt-3 border-top">
            <p class="text-muted small mb-2">¿Aún no tienes una cuenta?</p>
            <a href="/registro" class="btn btn-outline-success fw-semibold w-100 py-2 rounded-3">
                <i class="bi bi-person-plus me-1"></i> Crear una cuenta nueva
            </a>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/scrip.js') }}"></script>

</body>
</html>
